name: Demo - Staged deployment

# Create Test, Load-Test, and Production environments in repository settings.
# Add a required reviewer and a main-branch deployment rule to Production.
on:
  # Temporary branch trigger lets this workflow be tested before it reaches main.
  # Remove this push trigger after the demo branch is merged.
  push:
    branches:
      - feature/github-actions-cicd-demo
    paths:
      - '.github/workflows/staged-deployment.yml'
      - '.github/workflows/deploy-reusable.yml'
      - 'sample-app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Highest environment to deploy to'
        type: environment
        required: true
        default: Test

permissions:
  contents: read
  packages: read

concurrency:
  group: staged-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build container
        run: docker build --tag sample-app:${{ github.sha }} .

  deploy-test:
    name: Deploy to Test
    needs: build
    if: ${{ github.event_name == 'push' || inputs.environment == 'Test' || inputs.environment == 'Load-Test' || inputs.environment == 'Production' }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: Test
      image-tag: ${{ github.sha }}
      environment-url: https://test.example.com

  load-test:
    name: Deploy and test Load-Test
    needs: deploy-test
    if: ${{ inputs.environment == 'Load-Test' || inputs.environment == 'Production' }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: Load-Test
      image-tag: ${{ needs.deploy-test.outputs.deployed-version }}
      environment-url: https://load-test.example.com

  production:
    name: Deploy to Production
    needs: load-test
    if: ${{ inputs.environment == 'Production' }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: Production
      image-tag: ${{ needs.load-test.outputs.deployed-version }}
      environment-url: https://writeabout.net

  summary:
    name: Deployment summary
    needs: [deploy-test, load-test, production]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          TARGET_ENVIRONMENT: ${{ github.event_name == 'push' && 'Test' || inputs.environment }}
          DEPLOYED_VERSION: ${{ github.sha }}
          TEST_RESULT: ${{ needs.deploy-test.result }}
          LOAD_TEST_RESULT: ${{ needs.load-test.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          echo "## Staged deployment summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: $TARGET_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$DEPLOYED_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Load-Test: $LOAD_TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: $PRODUCTION_RESULT" >> "$GITHUB_STEP_SUMMARY"